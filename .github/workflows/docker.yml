name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushing to GHCR on release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Built and loaded locally first so the smoke test below runs against the
      # exact image that would be published, before anything is published.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: actual-budget-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that builds but cannot answer `initialize` is useless, and
      # nothing else in CI would catch it. Deliberately points at a server that
      # does not exist: startup must survive a failed connection, which is the
      # regression #39 introduced and process-guards.ts fixed.
      - name: Smoke test the MCP handshake
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
          response=$(printf '%s\n' "$request" | timeout 60 docker run -i --rm \
            -e ACTUAL_SERVER_URL=http://127.0.0.1:1 \
            -e ACTUAL_PASSWORD=ci \
            -e ACTUAL_BUDGET_ID=ci \
            actual-budget-mcp:ci 2>/dev/null || true)
          echo "$response"
          echo "$response" | grep -q '"serverInfo"' || {
            echo "::error::the image did not answer the MCP initialize handshake"
            exit 1
          }

      # The handshake above never opens a database, so it would pass with a
      # SQLite binary that cannot load. Alpine is musl and needs its own, and
      # the binaries now come from the package rather than being downloaded,
      # so this checks the one thing that change could break.
      - name: Smoke test SQLite on musl
        run: |
          docker run -i --rm --entrypoint node actual-budget-mcp:ci \
            -e "const db = new (require('better-sqlite3'))(':memory:'); db.prepare('select 1 as ok').get(); console.log('sqlite ok')" \
            | grep -q 'sqlite ok' || {
              echo "::error::the image cannot open a SQLite database"
              exit 1
            }

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        if: github.event_name == 'release'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Push to GHCR
        if: github.event_name == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
