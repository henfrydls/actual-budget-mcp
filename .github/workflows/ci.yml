name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor, the current LTS and the newest. Each has a published
        # better-sqlite3 prebuild; 20 and 23 do not, which is why they are gone
        # and why their jobs took four times as long as the rest.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      # The tests are excluded from the build, and vitest transpiles without
      # checking, so nothing type-checked them (#109). A reference to
      # something that does not exist is invisible until the line runs, and
      # inside a gated test it never does: that is how a call to a function
      # nobody had imported reached the smoke tests.
      - run: npm run typecheck
      - run: npm test

  # The paths this server builds are the one thing a Linux runner cannot
  # check: `default-data-dir` hard coded a forward slash and passed here for
  # as long as it existed, until somebody ran the suite on Windows and
  # reported it (#172). One job, on the LTS, because what it tests is the
  # platform and not the Node version.
  #
  # `--ignore-scripts`, the same flag and the same reason as the Dockerfile:
  # `better-sqlite3` ships a `binding.gyp`, npm runs `node-gyp rebuild` for
  # any package that has one, and node-gyp looks for Visual Studio before it
  # looks at whether it has anything to compile. The prebuilt N-API binaries
  # are already in the package. Measured on this image without the flag, the
  # install fails at `gyp ERR! find VS`; with it, the suite runs (#210).
  test-windows:
    runs-on: windows-latest
    # The suite takes a little over half an hour here, against five minutes
    # on Linux, so the default six-hour ceiling is no ceiling at all: one
    # hung test would spend a working day of runner time before anything
    # stopped it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The unit project, not the whole suite. What this job is for is the
      # code in this repository that can differ by platform, and that is all
      # unit-tested: the path building of #172, the data directory lock, the
      # sweep of the harness's own directories. The integration tests drive
      # the Actual engine, and on this runner they take about seventeen
      # seconds each against a fraction of a second on Linux: measured, one
      # file of forty tests took eleven minutes and the whole suite fifty,
      # with two tests crossing the sixty-second per-test ceiling on a slower
      # run. That is a required check that fails for reasons nobody can act
      # on. The Linux matrix runs the whole suite on every one of its three
      # versions.
      - run: npm test -- --project unit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Blocking gate: production dependencies are what users install, so a
      # high+ advisory there must fail the build.
      #
      # zod 3.x carries GHSA-mrhx-c7xc-m3w5 (memory exhaustion on oversized
      # constrained collections) with no patch in the 3.x branch; the
      # migration to zod 4 is tracked in #280. Remove this exception once
      # #280 lands.
      - name: Audit production dependencies
        run: |
          excepted='GHSA-mrhx-c7xc-m3w5'
          filter='[.vulnerabilities[]?.via[]?
            | select(type == "object")
            | select(.severity == "high" or .severity == "critical")
            | select((.url // "") | contains($excepted) | not)]'
          valid='has("vulnerabilities") and has("metadata")'

          # Self-test: the filter must catch a non-excepted advisory,
          # reject an npm-error JSON, and reject empty output.
          fake='{"vulnerabilities":{"x":{"via":[{"severity":"high","url":"https://github.com/advisories/GHSA-0000-0000-0000","name":"x","title":"injected"}]}},"metadata":{"vulnerabilities":{}}}'
          caught=$(printf '%s' "$fake" | jq --arg excepted "$excepted" "$filter | length")
          if [ "$caught" -ne 1 ]; then
            echo "::error::self-test: filter did not catch the injected advisory"
            exit 1
          fi
          err='{"error":{"code":"ENOTFOUND","summary":"request to https://registry.npmjs.org failed"}}'
          if printf '%s' "$err" | jq -e "$valid" >/dev/null 2>&1; then
            echo "::error::self-test: filter accepted an npm-error response"
            exit 1
          fi
          if printf '' | jq -e "$valid" >/dev/null 2>&1; then
            echo "::error::self-test: filter accepted empty output"
            exit 1
          fi

          audit=$(npm audit --omit=dev --json 2>/dev/null || true)
          if ! printf '%s' "$audit" | jq -e "$valid" >/dev/null 2>&1; then
            printf '%s' "$audit" | jq '.error // empty' 2>/dev/null || true
            echo "::error::npm audit did not return a valid report"
            exit 1
          fi

          hits=$(printf '%s' "$audit" | jq --arg excepted "$excepted" "$filter")
          count=$(printf '%s' "$hits" | jq 'length')

          if [ "$count" -gt 0 ]; then
            printf '%s' "$hits" | jq -r '.[] | "\(.severity) \(.name): \(.title)"'
            echo "::error::${count} high/critical production advisory/advisories not accounted for"
            exit 1
          fi
          echo "no unaccounted high/critical production advisories ($excepted excepted)"

      # Blocking as well, now that the tree is clean (#212). It was
      # informational for a reason that has gone: vitest 3 and what it pulled
      # in carried ten advisories, three of them critical, printed on every
      # run and fixable only by a two-major bump of the test runner. Eight
      # high-or-critical lines that are always there and never actionable are
      # how the ninth gets missed, so the step said them and let the build
      # pass.
      #
      # Not `npm audit --audit-level=high`, because npm cannot ignore one
      # advisory: the day one lands in the tooling with no fix, that command
      # offers carrying it silently or switching the step off for everything,
      # and this repository ran the second for a year. The script carries one
      # by GHSA id with the reason written beside it, in
      # .github/audit-allowlist.json, and fails on everything else at high or
      # above.
      - name: Audit development dependencies
        run: node scripts/audit-tooling.mjs

  # The Desktop Extension is built on every change so a broken manifest or a
  # version that drifted from package.json fails here, not when someone is
  # trying to cut a release.
  build-mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build the Desktop Extension
        run: ./scripts/build-mcpb.sh "$RUNNER_TEMP/actual-budget-mcp.mcpb"
      - name: Validate the packed bundle
        run: npx --yes @anthropic-ai/mcpb@2.1.2 info "$RUNNER_TEMP/actual-budget-mcp.mcpb"

      # The build runs this check itself, and a check that only ever sees a
      # good bundle cannot be shown to work: a review slipped three mutations
      # past the earlier version, including deleting the binaries after the
      # check and before the pack. So it is run against a bundle broken on
      # purpose, and must refuse it. A real platform is removed rather than a
      # fictional one declared, because `mcpb pack` rejects unknown platforms
      # by schema and would fail for the wrong reason.
      - name: The bundle check can fail
        run: |
          set -u
          # A whole platform missing.
          cp "$RUNNER_TEMP/actual-budget-mcp.mcpb" "$RUNNER_TEMP/no-darwin.mcpb"
          zip -q -d "$RUNNER_TEMP/no-darwin.mcpb" \
            "node_modules/better-sqlite3/prebuilds/darwin-*.node"
          if bash ./scripts/verify-mcpb.sh "$RUNNER_TEMP/no-darwin.mcpb"; then
            echo "::error::verify-mcpb.sh accepted a bundle with no darwin binary"
            exit 1
          fi

          # One architecture missing everywhere, which is the case a check on
          # the platform prefix alone cannot see: an arm64-only bundle is
          # broken for every Intel Mac and every x64 Windows.
          cp "$RUNNER_TEMP/actual-budget-mcp.mcpb" "$RUNNER_TEMP/no-x64.mcpb"
          zip -q -d "$RUNNER_TEMP/no-x64.mcpb" \
            "node_modules/better-sqlite3/prebuilds/*-x64.node"
          if bash ./scripts/verify-mcpb.sh "$RUNNER_TEMP/no-x64.mcpb"; then
            echo "::error::verify-mcpb.sh accepted an arm64-only bundle"
            exit 1
          fi

          # The icon the manifest points at, taken out of the archive. The
          # packer checks that file against the staging directory, so a
          # bundle that lost it on the way into the zip looks fine to
          # everything except a check that reads the zip.
          cp "$RUNNER_TEMP/actual-budget-mcp.mcpb" "$RUNNER_TEMP/no-icon.mcpb"
          zip -q -d "$RUNNER_TEMP/no-icon.mcpb" "$(node -p "require('./manifest.json').icon")"
          if bash ./scripts/verify-mcpb.sh "$RUNNER_TEMP/no-icon.mcpb"; then
            echo "::error::verify-mcpb.sh accepted a bundle with no icon"
            exit 1
          fi
          echo "the check refused all three, as it should"

      # Refusing is half of it: a packed file left on disk after an exit 1 is
      # one somebody picks up later believing it was built.
      - name: A failed build leaves no bundle behind
        run: |
          set -u
          cp scripts/verify-mcpb.sh "$RUNNER_TEMP/verify.bak"
          printf '#!/usr/bin/env bash\nexit 1\n' > scripts/verify-mcpb.sh
          rm -f "$RUNNER_TEMP/doomed.mcpb"
          ./scripts/build-mcpb.sh "$RUNNER_TEMP/doomed.mcpb" && status=0 || status=$?
          cp "$RUNNER_TEMP/verify.bak" scripts/verify-mcpb.sh
          if [ "$status" -eq 0 ]; then
            echo "::error::build-mcpb.sh succeeded with a failing verification"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/doomed.mcpb" ]; then
            echo "::error::build-mcpb.sh left a bundle behind after failing"
            exit 1
          fi
          echo "no bundle left behind, as it should be"

      # The bundle now carries its own server, so an artifact built here does
      # run this commit. That was not true while it launched a pinned release
      # from npm, and the name said so; the warning can go with the pin.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actual-budget-mcp-mcpb
          path: ${{ runner.temp }}/actual-budget-mcp.mcpb
