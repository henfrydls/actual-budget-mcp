name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents:write is needed only to attach the .mcpb to the release; the
      # workflow does not push code. Narrower than it looks: a release asset
      # upload cannot modify the repository.
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Publishes with provenance. Auth uses an npm Automation token (bypasses
      # 2FA/OTP) stored in the NPM_TOKEN repository secret.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Attach the Desktop Extension to the release, so the README's download
      # link points at something that exists for every version.
      - name: Build the Desktop Extension
        run: ./scripts/build-mcpb.sh "$RUNNER_TEMP/actual-budget-mcp.mcpb"

      - name: Attach it to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/actual-budget-mcp.mcpb" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishing to the MCP registry used to be a manual step done afterwards,
  # and 0.8.3 shows what that costs: it never happened, so the registry
  # advertised 0.8.2 for two weeks while npm served 0.8.3. A step that lives in
  # someone's memory is a step that eventually does not run.
  #
  # Its own job, because of what happened publishing 0.10.4: npm took more than
  # two and a half minutes to show the new version, the retries ran out, and
  # npm, the container image and the .mcpb had all succeeded. Re-running the
  # job would have failed on `npm publish`, which refuses a version that is
  # already there, so the registry entry had to be published by hand. Split
  # like this, the half that failed is the half that can be re-run.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      id-token: write # OIDC for the MCP registry
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned on purpose. `releases/latest` would silently upgrade the tool
      # under us, and a behaviour change would break a release at the worst
      # possible moment: after npm has already published. This is the same drift
      # that let us ship against an @actual-app/api version CI never tested.
      # Bump deliberately, like any other dependency.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      # package.json is the single source of the version; every other copy is
      # kept in step by hand and can fall behind (0.8.3 did). Deriving it here
      # means a stale server.json in the repo cannot make the registry advertise
      # the wrong version or point at an image that is not this release.
      - name: Align server.json with the version being published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '
            .version = $v
            | .packages = (.packages | map(
                if .registryType == "npm" then .version = $v
                elif .registryType == "oci" then .identifier = (.identifier | sub(":[^:]+$"; ":" + $v))
                else . end))
          ' server.json > server.tmp && mv server.tmp server.json
          echo "publishing $VERSION"
          jq -r '.version, (.packages[] | .identifier + " " + (.version // "tag in identifier"))' server.json

      # Two races to wait out, both of which resolve themselves: npm needs a
      # moment to propagate before the registry will accept the entry, and the
      # container image is built by a separate workflow running in parallel.
      #
      # The waiting happens here, with nothing signed in. The registry's token
      # lasts five minutes from the login, and `mcp-publisher publish` uses
      # the token it was given without renewing it, so waiting with a session
      # open spends the session: a loop that logged in first and then waited
      # ten minutes for npm had no credentials left by the time npm answered.
      # That is why re-running the job by hand worked for 0.10.6, and it is
      # why the login is the last thing before the publish (#199).
      #
      # npm is asked directly rather than through the publisher, so a 404 from
      # npm is told apart from everything else that can refuse a publish.
      - name: Publish to the MCP registry
        timeout-minutes: 20
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          IMAGE=henfrydls/actual-budget-mcp

          wait_for() {
            # $1 what it is, $2 attempts, $3 seconds between them, $4... the check
            local what="$1" attempts="$2" gap="$3"
            shift 3
            local attempt
            for attempt in $(seq 1 "$attempts"); do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "waiting for ${what}: attempt ${attempt} of ${attempts}"
                sleep "$gap"
              fi
            done
            return 1
          }

          image_exists() {
            local token
            token=$(curl -sS --max-time 30 \
              "https://ghcr.io/token?scope=repository:${IMAGE}:pull&service=ghcr.io" | jq -r .token)
            curl -sf --max-time 30 -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/${IMAGE}/manifests/${VERSION}"
          }

          npm_has_version() {
            npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1
          }

          # The image first, because publishing an entry that points at a tag
          # nobody can pull is worse than publishing nothing: the registry
          # would advertise an install command that fails for everyone.
          # Five minutes, since it is built alongside this and takes about two.
          if ! wait_for "the ghcr ${VERSION} tag" 20 15 image_exists; then
            echo "::error::ghcr has no ${VERSION} tag after five minutes, so the registry entry"
            echo "::error::would point at an image nobody can pull. npm, the release asset and"
            echo "::error::the image build are separate: check whether the image workflow failed,"
            echo "::error::then re-run this job alone."
            exit 1
          fi

          # Ten minutes for npm, which is the one that was short: 0.10.6 took
          # about seven to serve the new version.
          if ! wait_for "npm to serve ${PACKAGE}@${VERSION}" 20 30 npm_has_version; then
            echo "::error::npm is still not serving ${PACKAGE}@${VERSION} after ten minutes."
            echo "::error::npm, the image and the release asset are already done: re-run this"
            echo "::error::job alone once npm serves the version."
            exit 1
          fi

          # Both races are over, so this should go first time. The retries are
          # for a hiccup between here and the registry, and each one signs in
          # again because the token does not outlive five minutes.
          for attempt in 1 2 3; do
            ./mcp-publisher login github-oidc
            if out=$(./mcp-publisher publish 2>&1); then
              echo "$out"
              echo "published ${VERSION} to the MCP registry"
              exit 0
            fi
            echo "$out"

            # Waiting does not fix any of these, and the message for a slow
            # npm would send the reader to the wrong place.
            case "$out" in
              *401*|*403*|*nauthorized*|*orbidden*)
                echo "::error::the MCP registry refused the workflow's credentials. This is not"
                echo "::error::npm being slow: check the id-token permission and the registry's"
                echo "::error::trust of this repository."
                exit 1
                ;;
              *409*|*already\ exists*|*uplicate*)
                echo "::notice::the MCP registry already has ${VERSION}, so there is nothing to do."
                exit 0
                ;;
              *422*|*alidation*)
                echo "::error::the MCP registry rejected server.json for ${VERSION}. Fix the file;"
                echo "::error::re-running this job will not change the answer."
                exit 1
                ;;
            esac

            if [ "$attempt" -lt 3 ]; then
              echo "publish failed, trying again: attempt ${attempt} of 3"
              sleep 20
            fi
          done

          echo "::error::could not publish ${VERSION} to the MCP registry. npm is serving the"
          echo "::error::version and the image is there, so this is the registry itself:"
          echo "::error::re-run this job alone."
          exit 1
